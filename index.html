<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkyBook - Airline Reservation</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav>

        <div class="logo">
            ✈️ SkyBook
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="#flight-results">
                Flights
            </a>

            <a href="my-bookings.html">
                My Bookings
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             HERO
        ================================================== -->

        <h1>
            Book Your Next Journey ✈️
        </h1>


        <p class="subtitle">
            Search and reserve your flight with ease
        </p>



        <!-- =================================================
             FLIGHT SEARCH
        ================================================== -->

        <div class="search-box">


            <!-- FROM -->

            <div class="input-group">

                <label for="from">
                    From
                </label>

                <input
                    type="text"
                    id="from"
                    placeholder="e.g. Chennai"
                >

            </div>


            <!-- TO -->

            <div class="input-group">

                <label for="to">
                    To
                </label>

                <input
                    type="text"
                    id="to"
                    placeholder="e.g. Delhi"
                >

            </div>


            <!-- DEPARTURE -->

            <div class="input-group">

                <label for="departure">
                    Departure
                </label>

                <input
                    type="date"
                    id="departure"
                >

            </div>


            <!-- PASSENGERS -->

            <div class="input-group">

                <label for="passengers">
                    Passengers
                </label>

                <select id="passengers">

                    <option value="1">
                        1 Adult
                    </option>

                    <option value="2">
                        2 Adults
                    </option>

                    <option value="3">
                        3 Adults
                    </option>

                    <option value="4">
                        4 Adults
                    </option>

                    <option value="5">
                        5 Adults
                    </option>

                </select>

            </div>


            <!-- SEARCH -->

            <button
                type="button"
                onclick="searchFlights()"
            >

                🔍 Search Flights

            </button>


        </div>



        <!-- =================================================
             FLIGHT RESULTS
        ================================================== -->

        <section
            id="flight-results"
            class="flight-results"
        >

            <h2>
                Available Flights ✈️
            </h2>


            <div id="flight-list"></div>

        </section>



        <!-- =================================================
             PASSENGER DETAILS
        ================================================== -->

        <section
            id="passenger-section"
            class="passenger-section"
            style="display: none;"
        >

            <h2>
                Passenger Details 👤
            </h2>


            <div class="passenger-card">


                <!-- NAME -->

                <div class="input-group">

                    <label for="passenger-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="passenger-name"
                        placeholder="Enter passenger name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="passenger-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="passenger-email"
                        placeholder="Enter email address"
                    >

                </div>


                <!-- PHONE -->

                <div class="input-group">

                    <label for="passenger-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="passenger-phone"
                        placeholder="Enter 10-digit phone number"
                    >

                </div>


                <!-- IMPORTANT:
                     THIS IS NOT CONFIRM BOOKING.
                     IT OPENS THE SEAT SELECTION.
                -->

                <button
                    type="button"
                    onclick="continueToSeats()"
                >

                    Continue to Seat Selection →

                </button>


            </div>

        </section>



        <!-- =================================================
             SEAT SELECTION
        ================================================== -->

        <section
            id="seat-section"
            class="seat-section"
            style="display: none;"
        >


            <h2>
                Choose Your Seat 💺
            </h2>


            <!-- SELECTED FLIGHT -->

            <div
                id="selected-flight-info"
                class="selected-flight-info"
            >

            </div>


            <!-- SEAT LEGEND -->

            <div class="seat-legend">


                <div class="legend-item">

                    <span class="legend-seat available"></span>

                    <span>
                        Available
                    </span>

                </div>


                <div class="legend-item">

                    <span class="legend-seat selected"></span>

                    <span>
                        Selected
                    </span>

                </div>


                <div class="legend-item">

                    <span class="legend-seat occupied"></span>

                    <span>
                        Booked
                    </span>

                </div>


                <div class="legend-item">

                    <span class="legend-seat blocked"></span>

                    <span>
                        Blocked
                    </span>

                </div>


            </div>



            <!-- =================================================
                 AIRCRAFT
            ================================================== -->

            <div class="aircraft">


                <div class="aircraft-header">

                    ✈️ Aircraft

                </div>


                <div class="cockpit">

                    FRONT

                </div>


                <!-- IMPORTANT:
                     script.js uses .seat-map
                -->

                <div
                    class="seat-map"
                >

                </div>


                <div class="aircraft-back">

                    REAR

                </div>


            </div>



            <!-- =================================================
                 SELECTED SEAT
            ================================================== -->

            <div class="selected-seat-display">

                Selected Seat:

                <strong id="selected-seat">
                    None
                </strong>

            </div>



            <!-- =================================================
                 CONFIRM BOOKING
                 THIS IS THE FINAL BUTTON
            ================================================== -->

            <button
                type="button"
                class="confirm-booking-btn"
                onclick="confirmBooking()"
            >

                Confirm Booking ✓

            </button>


        </section>


    </main>



    <!-- =====================================================
         CUSTOM ALERT
    ====================================================== -->

    <div
        id="custom-alert"
        class="custom-alert-overlay"
    >

        <div class="custom-alert-box">


            <div class="custom-alert-icon">

                ⚠️

            </div>


            <h2 id="custom-alert-title">

                Alert

            </h2>


            <p id="custom-alert-message">

                Please check your information.

            </p>


            <button
                type="button"
                onclick="closeCustomAlert()"
            >

                OK

            </button>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
