<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkyBook - Create Account</title>

    <link rel="stylesheet" href="register.css">

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                ✈️ SkyBook
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your SkyBook account to book flights.
            </p>


            <form id="register-form">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- CUSTOM ALERT -->

    <div
        id="custom-alert"
        class="alert-overlay"
    >

        <div class="alert-box">

            <div
                id="alert-icon"
                class="alert-icon"
            >
                ⚠️
            </div>

            <h2 id="alert-title">
                Alert
            </h2>

            <p id="alert-message">
                Message
            </p>

            <button id="alert-button">
                OK
            </button>

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
