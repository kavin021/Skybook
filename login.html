<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBook - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="sb-nav">
        <a href="index.html" class="sb-logo">✈️ SkyBook</a>
        <nav class="sb-nav-links" data-nav-links aria-label="Main">
            <a href="index.html">Home</a>
            <a href="my-bookings.html">My Bookings</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card sb-card">

            <div class="auth-icon" aria-hidden="true">✈️</div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Log in to see your trips and book faster.</p>

            <form id="login-form" class="auth-form" novalidate>

                <div class="sb-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="sb-field">
                    <label for="password">Password</label>
                    <div class="sb-password">
                        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="sb-password-toggle" aria-label="Show password">👁</button>
                    </div>
                </div>

                <button type="submit" id="login-button" class="sb-btn sb-btn-primary sb-btn-block">Log in</button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="login.js"></script>
</body>
</html>
